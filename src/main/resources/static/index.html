<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مستشفى الرعاية الطبية</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,sans-serif}
body{margin:0;background:#eef3f8}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a4d8c}
.card{background:#fff;width:380px;padding:30px;border-radius:12px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,.2)}
input,select{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:6px}
button{width:100%;padding:12px;background:#0a4d8c;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:5px}
#appScreen{display:none}
.nav{background:#0a4d8c;color:#fff;padding:15px 25px;display:flex;justify-content:space-between;align-items:center}
.box{max-width:1000px;margin:20px auto;background:#fff;padding:20px;border-radius:10px}
.tabs{display:flex;gap:10px;margin-bottom:15px}
.tab{flex:1;background:#cbd5e1;color:#000}
.tab.active{background:#0a4d8c;color:#fff}
.sec{display:none}
.sec.active{display:block}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
</style>
<script>
const USERS = {
  admin:  {pass:'admin',  name:'الاستقبال والإدارة', tab:'reception', all:['reception','clinic','lab','pharmacy']},
  doctor: {pass:'doctor', name:'الطبيب المناوب',      tab:'clinic',    all:['clinic']},
  lab:    {pass:'lab',    name:'فني المختبر',        tab:'lab',       all:['lab']},
  pharm:  {pass:'pharm',  name:'الصيدلي المناوب',    tab:'pharmacy',  all:['pharmacy']}
};

function login() {
  const u = document.getElementById('u').value.trim().toLowerCase();
  const p = document.getElementById('p').value.trim();
  if (USERS[u] && USERS[u].pass === p) {
    document.getElementById('welcome').innerText = USERS[u].name;
    ['reception','clinic','lab','pharmacy'].forEach(t => {
      document.getElementById('b_'+t).style.display = USERS[u].all.includes(t) ? 'block' : 'none';
    });
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    openTab(USERS[u].tab);
  } else {
    alert('اسم المستخدم أو كلمة المرور خطأ!');
  }
}

function logout() {
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

function openTab(t) {
  document.querySelectorAll('.sec,.tab').forEach(e => e.classList.remove('active'));
  document.getElementById(t).classList.add('active');
  document.getElementById('b_'+t).classList.add('active');
  loadData();
}

async function addPatient() {
  await fetch('/api/records', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({patientName: pname.value, nationalId: pid.value, clinic: pclinic.value})});
  alert('تم التحويل للعيادة'); pname.value=''; pid.value=''; loadData();
}

async function saveClinic(id) {
  await fetch('/api/records/'+id+'/clinic', {method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({diagnosis: document.getElementById('d'+id).value, labTest: document.getElementById('l'+id).value, medicine: document.getElementById('m'+id).value})});
  alert('تم الحفظ'); loadData();
}

async function saveLab(id) {
  await fetch('/api/records/'+id+'/lab', {method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({labResult: document.getElementById('r'+id).value})});
  alert('تم اعتماد النتيجة'); loadData();
}

async function dispense(id) {
  await fetch('/api/records/'+id+'/pharmacy', {method:'PUT'});
  alert('تم صرف الدواء'); loadData();
}

async function loadData() {
  try {
    const res = await fetch('/api/records');
    const data = await res.json();
    clinicTbl.innerHTML = '<tr><th>المريض</th><th>العيادة</th><th>الحالة</th><th>التشخيص</th><th>تحليل</th><th>دواء</th><th>حفظ</th></tr>' +
      data.map(r => `<tr><td>${r.patientName}</td><td>${r.clinic}</td><td>${r.status}</td>
      <td><input id="d${r.id}" value="${r.diagnosis}"></td><td><input id="l${r.id}" value="${r.labTest}"></td><td><input id="m${r.id}" value="${r.medicine}"></td>
      <td><button onclick="saveClinic(${r.id})">حفظ</button></td></tr>`).join('');
    labTbl.innerHTML = '<tr><th>المريض</th><th>التحليل</th><th>النتيجة</th><th>اعتماد</th></tr>' +
      data.filter(r => r.labTest && r.labTest !== 'لا يوجد').map(r => `<tr><td>${r.patientName}</td><td>${r.labTest}</td>
      <td><input id="r${r.id}" value="${r.labResult}"></td><td><button onclick="saveLab(${r.id})">اعتماد</button></td></tr>`).join('');
    pharmTbl.innerHTML = '<tr><th>المريض</th><th>التشخيص</th><th>النتيجة</th><th>الدواء</th><th>الحالة</th><th>صرف</th></tr>' +
      data.map(r => `<tr><td>${r.patientName}</td><td>${r.diagnosis}</td><td>${r.labResult}</td><td>${r.medicine}</td><td>${r.status}</td>
      <td><button onclick="dispense(${r.id})">صرف</button></td></tr>`).join('');
  } catch(e) {}
}
</script>
</head>
<body>
<div id="loginScreen">
  <div class="card">
    <h2>🏥 مستشفى الرعاية الطبية</h2>
    <input id="u" placeholder="Username (admin / doctor / lab / pharm)">
    <input id="p" type="password" placeholder="Password">
    <button onclick="login()">تسجيل الدخول</button>
  </div>
</div>
<div id="appScreen">
  <div class="nav">
    <b>🏥 مستشفى الرعاية الطبية - <span id="welcome"></span></b>
    <button style="width:auto;background:#dc2626" onclick="logout()">خروج</button>
  </div>
  <div class="box">
    <div class="tabs">
      <button class="tab" id="b_reception" onclick="openTab('reception')">الاستقبال</button>
      <button class="tab" id="b_clinic" onclick="openTab('clinic')">العيادة</button>
      <button class="tab" id="b_lab" onclick="openTab('lab')">المختبر</button>
      <button class="tab" id="b_pharmacy" onclick="openTab('pharmacy')">الصيدلية</button>
    </div>
    <div id="reception" class="sec">
      <h3>تسجيل مريض جديد</h3>
      <input id="pname" placeholder="اسم المريض"><input id="pid" placeholder="رقم الهوية">
      <select id="pclinic"><option>الطب العام</option><option>الباطنة</option><option>الأطفال</option></select>
      <button onclick="addPatient()">تسجيل وتحويل</button>
    </div>
    <div id="clinic" class="sec"><h3>العيادة</h3><table id="clinicTbl"></table></div>
    <div id="lab" class="sec"><h3>المختبر</h3><table id="labTbl"></table></div>
    <div id="pharmacy" class="sec"><h3>الصيدلية</h3><table id="pharmTbl"></table></div>
  </div>
</div>
</body>
</html>
