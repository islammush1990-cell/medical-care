<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>النظام الطبي المتكامل</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; }
        .header { background: #0d6efd; color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .tabs { display: flex; gap: 10px; margin: 20px 0; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #dee2e6; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 16px; }
        .tab-btn.active { background: #0d6efd; color: white; }
        .section { display: none; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .section.active { display: block; }
        input, select, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button.action { background: #198754; color: white; border: none; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #f8f9fa; }
        .badge { padding: 5px 10px; border-radius: 12px; background: #ffc107; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h2>🏥 النظام الطبي المتكامل (الاستقبال - العيادة - المختبر - الصيدلية)</h2>
</div>

<div class="tabs">
    <button class="tab-btn active" onclick="showTab('reception')">1. الاستقبال</button>
    <button class="tab-btn" onclick="showTab('clinic')">2. العيادة</button>
    <button class="tab-btn" onclick="showTab('lab')">3. المختبر</button>
    <button class="tab-btn" onclick="showTab('pharmacy')">4. الصيدلية</button>
</div>

<!-- قسم الاستقبال -->
<div id="reception" class="section active">
    <h3>تسجيل زيارة مريض جديد</h3>
    <input type="text" id="pName" placeholder="اسم المريض الرباعي">
    <input type="text" id="pId" placeholder="رقم الهوية">
    <select id="pClinic">
        <option value="الطب العام">عيادة الطب العام</option>
        <option value="الباطنة">عيادة الباطنة</option>
        <option value="الأطفال">عيادة الأطفال</option>
    </select>
    <button class="action" onclick="addPatient()">تسجيل وتحويل للعيادة</button>
</div>

<!-- قسم العيادة -->
<div id="clinic" class="section">
    <h3>شاشة الطبيب</h3>
    <table id="clinicTable"></table>
</div>

<!-- قسم المختبر -->
<div id="lab" class="section">
    <h3>شاشة المختبر</h3>
    <table id="labTable"></table>
</div>

<!-- قسم الصيدلية -->
<div id="pharmacy" class="section">
    <h3>شاشة الصيدلية</h3>
    <table id="pharmacyTable"></table>
</div>

<script>
    function showTab(tabId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
        loadData();
    }

    async function addPatient() {
        const data = {
            patientName: document.getElementById('pName').value,
            nationalId: document.getElementById('pId').value,
            clinic: document.getElementById('pClinic').value
        };
        await fetch('/api/records', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        alert('تم تسجيل المريض وتحويله للعيادة');
        document.getElementById('pName').value = '';
        document.getElementById('pId').value = '';
        loadData();
    }

    async function saveClinic(id) {
        const data = {
            diagnosis: document.getElementById('diag_' + id).value,
            labTest: document.getElementById('lab_' + id).value,
            medicine: document.getElementById('med_' + id).value
        };
        await fetch(`/api/records/${id}/clinic`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        loadData();
    }

    async function saveLab(id) {
        const data = { labResult: document.getElementById('res_' + id).value };
        await fetch(`/api/records/${id}/lab`, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        loadData();
    }

    async function dispenseMed(id) {
        await fetch(`/api/records/${id}/pharmacy`, { method: 'PUT' });
        loadData();
    }

    async function loadData() {
        const res = await fetch('/api/records');
        const records = await res.json();

        // تحديث جدول العيادة
        let cHtml = '<tr><th>المريض</th><th>العيادة</th><th>الحالة</th><th>التشخيص</th><th>طلب تحليل</th><th>وصفة الدواء</th><th>إجراء</th></tr>';
        records.forEach(r => {
            cHtml += `<tr>
                <td>${r.patientName}</td><td>${r.clinic}</td><td><span class="badge">${r.status}</span></td>
                <td><input id="diag_${r.id}" value="${r.diagnosis}"></td>
                <td><input id="lab_${r.id}" value="${r.labTest}" placeholder="اسم التحليل"></td>
                <td><input id="med_${r.id}" value="${r.medicine}" placeholder="اسم الدواء"></td>
                <td><button class="action" onclick="saveClinic(${r.id})">حفظ وإرسال</button></td>
            </tr>`;
        });
        document.getElementById('clinicTable').innerHTML = cHtml;

        // تحديث جدول المختبر
        let lHtml = '<tr><th>المريض</th><th>التحليل المطلوب</th><th>النتيجة</th><th>إجراء</th></tr>';
        records.filter(r => r.labTest && r.labTest !== 'لا يوجد').forEach(r => {
            lHtml += `<tr>
                <td>${r.patientName}</td><td>${r.labTest}</td>
                <td><input id="res_${r.id}" value="${r.labResult}"></td>
                <td><button class="action" onclick="saveLab(${r.id})">اعتماد النتيجة</button></td>
            </tr>`;
        });
        document.getElementById('labTable').innerHTML = lHtml;

        // تحديث جدول الصيدلية
        let pHtml = '<tr><th>المريض</th><th>التشخيص</th><th>نتيجة المختبر</th><th>الدواء المطلوب</th><th>الحالة</th><th>إجراء</th></tr>';
        records.forEach(r => {
            pHtml += `<tr>
                <td>${r.patientName}</td><td>${r.diagnosis}</td><td>${r.labResult}</td><td>${r.medicine}</td>
                <td><span class="badge">${r.status}</span></td>
                <td><button class="action" onclick="dispenseMed(${r.id})">صرف الدواء</button></td>
            </tr>`;
        });
        document.getElementById('pharmacyTable').innerHTML = pHtml;
    }
    loadData();
</script>
</body>
</html>
